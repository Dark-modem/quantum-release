# engines/naive.conf — the CORES-6 naive core (NaiveProxy
# v154.0.8037.49-5, BSD-3-Clause, UNMODIFIED upstream binaries
# digest-verified against the live release API; cores repo folder naive/).
# The core ships the CLIENT binary (naive-http2); the agent has no
# standalone naive engine id — the server half rides the sing-box naive
# inbound (OVERNIGHT-A3), so this pack exists for the R5 artifact store
# and the cores/panel ledger parity, not as a registered driver.
# PASSTHROUGH pack: the quantum-cores release asset IS the artifact
# (byte-identical, the digest the cores MANIFEST.json records); pack-engine.sh
# verifies the sha256 against the ledger manifest and re-signs with the
# ENGINE-ARTIFACT key. NOTE the naive version is the upstream Chromium
# shape (four numeric segments + -<build>) — the release pipeline parses
# pack names against the ledger tag, never by splitting on the last dash.
ENGINE=naive
PASSTHROUGH=1
URL_AMD64="https://github.com/Dark-modem/quantum-cores/releases/download/naive-v<ver>/naive-linux-amd64.tar.gz"
URL_ARM64="https://github.com/Dark-modem/quantum-cores/releases/download/naive-v<ver>/naive-linux-arm64.tar.gz"
SHA_URL=
LICENSE_NAME="BSD-3-Clause"
LICENSE_URL="https://raw.githubusercontent.com/klzgrad/naiveproxy/master/LICENSE"
UPSTREAM="https://github.com/klzgrad/naiveproxy"
