# engines/frp.conf — per-engine packing config for scripts/pack-engine.sh
# (phase 6 TASK 4). One file per engine; new engines = one new file here.
ENGINE=frp
# Upstream release URL templates: <ver> = version without the leading v.
URL_AMD64="https://github.com/fatedier/frp/releases/download/v<ver>/frp_<ver>_linux_amd64.tar.gz"
URL_ARM64="https://github.com/fatedier/frp/releases/download/v<ver>/frp_<ver>_linux_arm64.tar.gz"
# Upstream checksum file, if the project publishes one (empty = none).
SHA_URL=
# Where the binaries live inside the upstream archive (relative dir; the
# agent's extract step expects <inner>/<binary>).
INNER="frp_<ver>"
# Binaries to keep in the repacked artifact.
BINARIES="frps frpc"
# License text shipped inside the artifact + named in SOURCE.txt.
LICENSE_NAME=Apache-2.0
LICENSE_URL="https://raw.githubusercontent.com/fatedier/frp/v<ver>/LICENSE"
# Home page / repo recorded in SOURCE.txt.
UPSTREAM=https://github.com/fatedier/frp
