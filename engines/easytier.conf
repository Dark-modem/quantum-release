# engines/easytier.conf — the OVERNIGHT-D2 EasyTier core (unmodified upstream
# release binaries v2.7.1, LGPL-3.0, digest chain verified vs the upstream
# release SHA256SUMS; the core is PUBLISHED and the OVERNIGHT-A7 Easytier
# driver consumes it (14 registrations; gen-expected maps Easytier →
# easytier). pack-all-engines.sh and verify-engines.sh carry it as a
# first-class ledger pack.
# PASSTHROUGH pack: the quantum-cores release asset IS the artifact
# (byte-identical, the digest the cores MANIFEST.json records); pack-engine.sh
# verifies the sha256 against the ledger manifest and re-signs with the
# ENGINE-ARTIFACT key.
