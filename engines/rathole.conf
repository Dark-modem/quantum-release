# engines/rathole.conf — per-engine packing config (phase 8, task 2.1).
ENGINE=rathole
# rathole v0.5.0 ships ZIP archives with a bare binary (no version
# directory): rathole-x86_64-unknown-linux-gnu.zip (amd64, glibc — the
# musl x64 build was dropped in v0.5.0) and
# rathole-aarch64-unknown-linux-musl.zip (arm64, musl).
# NOTE for the packer: these are .zip, not .tar.gz — the packer must
# support zip extraction (or fetch+rezip) for this engine; the agent's
# extraction expects the REPACKAGED tar.gz with a directory entry
# (rathole_<ver>/rathole) + LICENSE + SOURCE.txt inside.
URL_AMD64="https://github.com/rapiz1/rathole/releases/download/v<ver>/rathole-x86_64-unknown-linux-gnu.zip"
URL_ARM64="https://github.com/rapiz1/rathole/releases/download/v<ver>/rathole-aarch64-unknown-linux-musl.zip"
SHA_URL=
INNER=
BINARIES="rathole"
LICENSE_NAME=Apache-2.0
LICENSE_URL=https://raw.githubusercontent.com/rapiz1/rathole/main/LICENSE
UPSTREAM=https://github.com/rapiz1/rathole
