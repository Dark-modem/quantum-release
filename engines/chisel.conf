# engines/chisel.conf — per-engine packing config (phase 7 TASK 1).
# NOTE: chisel releases ship FLAT .gz single binaries (chisel_<ver>_linux_<arch>.gz);
# the packer repackages them into the tarball-with-directory-entry shape the
# agents extract (the offline test proves the path).
ENGINE=chisel
URL_AMD64="https://github.com/jpillora/chisel/releases/download/v<ver>/chisel_<ver>_linux_amd64.gz"
URL_ARM64="https://github.com/jpillora/chisel/releases/download/v<ver>/chisel_<ver>_linux_arm64.gz"
SHA_URL=""
INNER="chisel_<ver>"
BINARIES="chisel"
LICENSE_NAME="MIT"
LICENSE_URL="https://raw.githubusercontent.com/jpillora/chisel/v<ver>/LICENSE"
UPSTREAM="https://github.com/jpillora/chisel"
