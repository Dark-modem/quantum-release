# engines/wireguard.conf — WIREGUARD USES THE KERNEL MODULE: there is no
# upstream userspace binary to pack in the default path (the driver's
# wireguard-go artifact is an optional fallback carried via engine_params
# and packed separately if ever needed). This file exists so the pack-all
# tooling can state that explicitly instead of silently skipping.
ENGINE=wireguard
KERNEL_ONLY=1
