URL_ARM64="https://github.com/Musixal/Backhaul/releases/download/v<ver>/backhaul_linux_arm64.tar.gz"
SHA_URL=
INNER=
BINARIES="backhaul"
LICENSE_NAME=AGPL-3.0
LICENSE_URL=https://raw.githubusercontent.com/Musixal/Backhaul/main/LICENSE
UPSTREAM=https://github.com/Musixal/Backhaul
