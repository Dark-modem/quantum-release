# engines/sing-box.conf — the OVERNIGHT-C sing-box core (vendored v1.14.4,
# GPL-3.0 binaries-only per the C-Tunnel ruling; the AGENT-31 driver id is
# "singbox" — the CORES repo FOLDER and the pack name carry the dash; the
# gen-expected.py LEDGER_ALIAS resolves the two spellings).
# PASSTHROUGH pack: the quantum-cores release asset IS the artifact
# (byte-identical, the digest the cores MANIFEST.json records); pack-engine.sh
# verifies the sha256 against the ledger manifest and re-signs with the
# ENGINE-ARTIFACT key. Upstream lineage: SagerNet/sing-box v<ver>,
# repackaged cores-side with the cronet-bound features excluded (OVERNIGHT-C).
ENGINE=sing-box
PASSTHROUGH=1
URL_AMD64="https://github.com/Dark-modem/quantum-cores/releases/download/sing-box-v<ver>/sing-box-linux-amd64.tar.gz"
URL_ARM64="https://github.com/Dark-modem/quantum-cores/releases/download/sing-box-v<ver>/sing-box-linux-arm64.tar.gz"
SHA_URL=
LICENSE_NAME=GPL-3.0
LICENSE_URL="https://raw.githubusercontent.com/SagerNet/sing-box/v<ver>/LICENSE"
UPSTREAM="https://github.com/SagerNet/sing-box"
