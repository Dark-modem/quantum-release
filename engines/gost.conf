URL_ARM64="https://github.com/go-gost/gost/releases/download/v<ver>/gost_<ver>_linux_arm64.tar.gz"
SHA_URL=
INNER=
BINARIES="gost"
LICENSE_NAME=MIT
LICENSE_URL=https://raw.githubusercontent.com/go-gost/gost/master/LICENSE
UPSTREAM=https://github.com/go-gost/gost
