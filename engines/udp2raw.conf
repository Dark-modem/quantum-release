# engines/udp2raw.conf — COMPANION engine packing config (phase 8, 2.3).
# udp2raw never runs standalone: it wraps a WireGuard tunnel's UDP carrier
# in fake-TCP (see 00-ADMIN/ENGINE-COMPANION-DESIGN.md).
ENGINE=udp2raw
# The upstream release is ONE bundle (udp2raw_binaries.tar.gz) containing
# per-arch flat binaries: udp2raw_amd64, udp2raw_arm, udp2raw_x86, ...
# The packer picks the arch binary and repackages as
# udp2raw_<ver>/udp2raw (+LICENSE+SOURCE) for the agent's extractor.
URL_AMD64="https://github.com/wangyu-/udp2raw/releases/download/v<ver>/udp2raw_binaries.tar.gz"
URL_ARM64="https://github.com/wangyu-/udp2raw/releases/download/v<ver>/udp2raw_binaries.tar.gz"
SHA_URL=
INNER="udp2raw_amd64"
BINARIES="udp2raw"
LICENSE_NAME=MIT
LICENSE_URL=https://raw.githubusercontent.com/wangyu-/udp2raw/master/LICENSE.md
UPSTREAM=https://github.com/wangyu-/udp2raw
