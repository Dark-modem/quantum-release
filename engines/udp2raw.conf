# engines/udp2raw.conf — COMPANION engine packing config (phase 8, 2.3).
# udp2raw never runs standalone: it wraps a WireGuard tunnel's UDP carrier
# in fake-TCP (see 00-ADMIN/ENGINE-COMPANION-DESIGN.md).
ENGINE=udp2raw
# The upstream release is ONE bundle (udp2raw_binaries.tar.gz) containing
# per-arch flat binaries: udp2raw_amd64, udp2raw_arm, udp2raw_x86, ...
# The packer picks the arch binary and repackages as
# udp2raw_<ver>/udp2raw (+LICENSE+SOURCE) for the agent's extractor.
URL_AMD64="https://github.com/wangyu-/udp2raw/releases/download/<ver>/udp2raw_binaries.tar.gz"
URL_ARM64="https://github.com/wangyu-/udp2raw/releases/download/<ver>/udp2raw_binaries.tar.gz"
SHA_URL=
INNER="udp2raw_<ver>"  # repacked dir: udp2raw_<ver>/udp2raw
BINARIES="udp2raw_{arch}"  # {arch}: the bundle ships udp2raw_amd64/udp2raw_aarch64; UPSTREAM_ARM64_NAME maps arm64→aarch64
LICENSE_NAME=MIT
LICENSE_URL=https://raw.githubusercontent.com/wangyu-/udp2raw/master/LICENSE.md
UPSTREAM=https://github.com/wangyu-/udp2raw

# NOTE (verified against the 20230206.0 bundle): upstream ships amd64/arm/
# x86/mips — NO aarch64 build. arm64 packing is expected to fail with
# "binary not found"; INDEX.md records the gap (companion is amd64-only
# until upstream publishes an aarch64 build).
UPSTREAM_ARM64_NAME="aarch64"
UPSTREAM="https://github.com/wangyu-/udp2raw"
