# engines/ctunnel.conf — per-engine packing config (phase 15).
ENGINE=ctunnel
# CIAUB/C-Tunnel v1.1.x ships RAW ELF binaries with NO archive wrapper:
# ctunnel-engine-linux-amd64 / ctunnel-engine-linux-arm64 (the userspace
# data plane; the ctunnel CLI/panel is NOT shipped — the agent drives
# ctunnel-engine -config <env> directly). scripts/pack-engine.sh accepts
# raw single-file assets via the ELF-magic case. Upstream publishes
# SHA256SUMS — verified at pack time (upstream-name grep fix).
URL_AMD64="https://github.com/CIAUB/C-Tunnel/releases/download/v<ver>/ctunnel-engine-linux-amd64"
URL_ARM64="https://github.com/CIAUB/C-Tunnel/releases/download/v<ver>/ctunnel-engine-linux-arm64"
SHA_URL="https://github.com/CIAUB/C-Tunnel/releases/download/v<ver>/SHA256SUMS"
BINARIES="ctunnel-engine"
LICENSE_NAME=AGPL-3.0
LICENSE_URL=https://raw.githubusercontent.com/CIAUB/C-Tunnel/main/LICENSE
UPSTREAM=https://github.com/CIAUB/C-Tunnel
