# engines/ctunnel.conf — per-engine packing config (phase 15; v2 rewrite AGENT-29).
ENGINE=ctunnel
# C-Tunnel v2.0.0 (upstream github.com/CIAUB/C-Tunnel, AGPL-3.0 — the v2
# replaces v1.1.1 completely: the ctunnel-v1.1.1 core release is removed and
# the cores MANIFEST.json is v2-only with the 49-method methods[] block).
#
# v2 IS PACKED FROM SOURCE, not from upstream release binaries:
#   source of truth = the human-provided deterministic snapshot
#   03-RESEARCH/c-tunnel-review/C-Tunnel-main (upstream v2.0.0 tree,
#   WSL tree fingerprint b9206cc1b4b5b722b0a139c68d0094bd12fbd7846598e475b36eb1607aa1e293),
#   built in WSL Ubuntu-24.04 with GOTOOLCHAIN=go1.26.9 CGO_ENABLED=0
#   go build -trimpath -ldflags "-s -w -X ctunnel/pkg/version.Version=<ver>"
#   (the go.mod toolchain directive go1.26.10 is NOT fetched — an explicit
#   GOTOOLCHAIN overrides it; without it every go command on the module
#   tries to download go1.26.10 and fails in this environment).
#   Upstream's own v2.0.0 CI binaries are go1.26.10 builds, so their
#   SHA256SUMS entries intentionally do NOT match a source build — SHA_URL
#   is left empty and provenance is recorded in the cores NOTICE.md.
#
# The packer consumes pre-staged source-build archives via --from:
#   ctunnel-<ver>-src-linux-<arch>.tar.gz =
#       ctunnel_<ver>/{ctunnel, ctunnel-engine, ctunnel-local} + LICENSE
#   (three binaries per the v2 core contract; the agent extracts only
#   ctunnel-engine; ctunnel-local ships in the core tarball but is NOT in
#   the upstream release assets — upstream ships ctunnel + ctunnel-engine
#   as raw single-file ELF binaries plus ctunnel-kernel.sh, which Quantum
#   does NOT run — the agent driver performs the kernel ops itself).
# URL_* below name those staging archives (the "<ver>-src" asset does not
# exist upstream, so an online re-pack without --from fails loudly BY
# DESIGN — a future re-pack must rebuild from the source snapshot).
URL_AMD64="https://github.com/CIAUB/C-Tunnel/releases/download/v<ver>/ctunnel-<ver>-src-linux-amd64.tar.gz"
URL_ARM64="https://github.com/CIAUB/C-Tunnel/releases/download/v<ver>/ctunnel-<ver>-src-linux-arm64.tar.gz"
SHA_URL=""
BINARIES="ctunnel ctunnel-engine ctunnel-local"
LICENSE_NAME=AGPL-3.0
LICENSE_URL=https://raw.githubusercontent.com/CIAUB/C-Tunnel/main/LICENSE
UPSTREAM=https://github.com/CIAUB/C-Tunnel
